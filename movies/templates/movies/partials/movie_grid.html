{% for movie in movies %}
<div class="group">
  <a href="/movies/{{ movie.id }}"
    class="block relative overflow-hidden rounded-xl shadow-md transform transition duration-300 group-hover:-translate-y-1 group-hover:shadow-2xl">
    <img
      class="w-full h-auto transition-all duration-300 ease-out group-hover:scale-110 group-hover:brightness-75"
      src="https://image.tmdb.org/t/p/w300{{ movie.poster_path }}"
      alt="{{ movie.title }}"
    />
    <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition duration-300 bg-gradient-to-t from-black/80 via-black/30 to-transparent flex items-end p-3">
      <div class="translate-y-3 group-hover:translate-y-0 transition duration-300">
        <p class="text-white text-xs sm:text-sm font-semibold">{{ movie.title }}</p>
        <p class="text-gray-300 text-xs">{{ movie.release_date }}</p>
      </div>
    </div>
  </a>
</div>
{% empty %}
<p class="text-gray-400 col-span-full text-center py-10">No se encontraron películas.</p>
{% endfor %}
