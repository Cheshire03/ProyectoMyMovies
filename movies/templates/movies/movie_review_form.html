<div id="modal" _="on closeModal or listChanged remove me" class="relative z-10" role="dialog" aria-modal="true">

    <div class="fixed inset-0 bg-gray-900 bg-opacity-80"></div>

    <div class="fixed inset-0 z-10 flex items-center justify-center">
        <div class="relative w-full max-w-3xl bg-[#2c3440] rounded-2xl px-8 shadow-2xl overflow-hidden">

            <div class="flex min-h-[400px]">

                <!-- POSTER -->
                <div class="w-48 flex-shrink-0 flex items-center justify-center">
                    <img src="https://image.tmdb.org/t/p/w300/{{ movie.poster_path }}" alt="{{ movie.title }}"
                        class="rounded-lg shadow-lg">
                </div>

                <!-- CONTENIDO -->
                <div class="flex-1 pl-8 py-6 flex flex-col">

                    <!-- Header -->
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <p class="text-gray-400 text-sm mb-1">I watched...</p>
                            <h2 class="text-2xl font-bold text-white">{{ movie.title }}
                                <span class="text-gray-400 font-normal text-xl">{{ movie.release_date|date:"Y" }}</span>
                            </h2>
                        </div>
                        <button type="button" _="on click trigger closeModal"
                            class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
                    </div>

                    <form hx-post="/movies/movie_review/add/{{ movie.id }}/" hx-target="#modal" hx-swap="outerHTML"
                        class="flex flex-col gap-4 flex-1">

                        <!-- Review textarea -->
                        <textarea name="review" rows="5" placeholder="Add a review..."
                            class="w-full bg-[#374151] text-white placeholder-gray-400 rounded-lg p-3 text-sm resize-none border border-gray-600 focus:outline-none focus:border-gray-400"></textarea>

                        <!-- Title y Rating -->
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="text-gray-400 text-xs mb-1 block">Título</label>
                                <input type="text" name="title" value="Reseña"
                                    class="w-full bg-[#374151] text-white rounded-lg px-3 py-2 text-sm border border-gray-600 focus:outline-none focus:border-gray-400">
                            </div>
                            <div class="w-28">
                                <label class="text-gray-400 text-xs mb-1 block">Rating (1-100)</label>
                                <input type="number" name="rating" min="1" max="100"
                                    class="w-full bg-[#374151] text-white rounded-lg px-3 py-2 text-sm border border-gray-600 focus:outline-none focus:border-gray-400">
                            </div>
                        </div>

                        <!-- Botones -->
                        <div class="flex items-center justify-end gap-3 mt-auto">
                            <button type="button" _="on click trigger closeModal"
                                class="text-sm text-gray-400 hover:text-white">Cancelar</button>
                            <button type="submit"
                                class="bg-green-500 hover:bg-green-400 text-white text-sm font-bold px-6 py-2 rounded-lg uppercase tracking-wide">
                                Save
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
